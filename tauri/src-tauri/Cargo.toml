[package]
name = "game-goal"
version = "1.5.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

# Маленький exe: оптимизация по размеру, без отладочных символов
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
