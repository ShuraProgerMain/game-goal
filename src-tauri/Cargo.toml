[package]
name = "game-goal"
version = "2.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"

# Ярлык в «Пуске» с AppUserModelID и команда gg в кодировке консоли (см. integration.rs)
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Storage_EnhancedStorage", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem",
] }

# Маленький exe: оптимизация по размеру, без отладочных символов
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
